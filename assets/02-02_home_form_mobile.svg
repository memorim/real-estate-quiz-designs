<svg xmlns="http://www.w3.org/2000/svg" width="430" height="960" viewBox="0 0 430 960"><title>Заявка / Место для вашей жизни</title><rect x="0" y="0" width="430" height="960" rx="0" fill="#F5EEE4"/><path d="M24 53V32l14 -8l14 8v21M32 53V41h12v12" fill="none" stroke="#362F2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="37" font-family="Segoe UI" font-size="16" font-weight="600" fill="#362F2B" text-anchor="start" letter-spacing="0">Анна Ермакова</text><text x="66" y="56" font-family="Segoe UI" font-size="8.5" font-weight="400" fill="#362F2B" text-anchor="start" letter-spacing="0.8">НЕДВИЖИМОСТЬ · ЕКАТЕРИНБУРГ</text><path d="M24 86L406 86" fill="none" stroke="#D6CDC1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="112" width="382" height="4" rx="2" fill="#7D3539"/><text x="24" y="151" font-family="Segoe UI" font-size="11" font-weight="400" fill="#746F68" text-anchor="start" letter-spacing="1.3">ПОСЛЕДНИЙ ШАГ</text><text x="24" y="207" font-family="Georgia" font-size="36" font-weight="400" fill="#362F2B" text-anchor="start" letter-spacing="0">Получите свои</text><text x="24" y="250" font-family="Georgia" font-size="36" font-weight="400" fill="#362F2B" text-anchor="start" letter-spacing="0">планировки</text><text x="24" y="295" font-family="Segoe UI" font-size="16" font-weight="400" fill="#746F68" text-anchor="start" letter-spacing="0">Анна уточнит ваши пожелания,</text><text x="24" y="321" font-family="Segoe UI" font-size="16" font-weight="400" fill="#746F68" text-anchor="start" letter-spacing="0">наличие квартир и актуальные условия.</text><text x="24" y="374" font-family="Segoe UI" font-size="14" font-weight="400" fill="#362F2B" text-anchor="start" letter-spacing="0">Как к вам обращаться</text><rect x="24" y="390" width="382" height="56" rx="7" fill="#FFFFFF" stroke="#D6CDC1"/><text x="42" y="425" font-family="Segoe UI" font-size="16" font-weight="400" fill="#746F68" text-anchor="start" letter-spacing="0">Имя (необязательно)</text><text x="24" y="483" font-family="Segoe UI" font-size="14" font-weight="400" fill="#362F2B" text-anchor="start" letter-spacing="0">Номер телефона</text><rect x="24" y="499" width="382" height="56" rx="7" fill="#FFFFFF" stroke="#D6CDC1"/><text x="42" y="534" font-family="Segoe UI" font-size="18" font-weight="400" fill="#746F68" text-anchor="start" letter-spacing="0">+7 (___) ___-__-__</text><text x="24" y="592" font-family="Segoe UI" font-size="14" font-weight="400" fill="#362F2B" text-anchor="start" letter-spacing="0">Как удобнее связаться?</text><rect x="24" y="609" width="120" height="43" rx="6" fill="#FFFFFF" stroke="#D6CDC1"/><text x="84.0" y="636" font-family="Segoe UI" font-size="14" font-weight="400" fill="#362F2B" text-anchor="middle" letter-spacing="0">Звонок</text><rect x="154" y="609" width="120" height="43" rx="6" fill="#FFFFFF" stroke="#D6CDC1"/><text x="214.0" y="636" font-family="Segoe UI" font-size="14" font-weight="400" fill="#362F2B" text-anchor="middle" letter-spacing="0">Telegram</text><rect x="284" y="609" width="122" height="43" rx="6" fill="#FFFFFF" stroke="#D6CDC1"/><text x="345.0" y="636" font-family="Segoe UI" font-size="14" font-weight="400" fill="#362F2B" text-anchor="middle" letter-spacing="0">MAX</text><rect x="24" y="686" width="18" height="18" rx="3" fill="none" stroke="#D6CDC1"/><text x="54" y="698" font-family="Segoe UI" font-size="12" font-weight="400" fill="#746F68" text-anchor="start" letter-spacing="0">Согласен(на) на обработку персональных</text><text x="54" y="718" font-family="Segoe UI" font-size="12" font-weight="400" fill="#746F68" text-anchor="start" letter-spacing="0">данных согласно политике конфиденциальности</text><rect x="24" y="755" width="382" height="60" rx="5" fill="#7D3539"/><text x="48" y="791.0" font-family="Segoe UI" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Получить планировки</text><path d="M358 785.0h20m-7 -7l7 7l-7 7" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="856" font-family="Segoe UI" font-size="13" font-weight="400" fill="#746F68" text-anchor="start" letter-spacing="0">Свяжемся после обработки заявки.</text><text x="24" y="878" font-family="Segoe UI" font-size="13" font-weight="400" fill="#746F68" text-anchor="start" letter-spacing="0">Ответы квиза сохранятся вместе с контактами.</text><text x="24" y="931" font-family="Segoe UI" font-size="13" font-weight="400" fill="#746F68" text-anchor="start" letter-spacing="0">Вернуться к ответам</text></svg>